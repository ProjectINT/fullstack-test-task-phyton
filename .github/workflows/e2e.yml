name: E2E

on:
  push:
  pull_request:

# Прогон долгий (сборка образов + Playwright): для одной ветки держим один.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE: docker compose -f docker-compose.dev.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start stack
        run: $COMPOSE up -d --build

      # Postgres поднимается дольше бэкенда, поэтому миграции — с ретраями.
      - name: Apply migrations
        run: |
          for attempt in $(seq 1 30); do
            if $COMPOSE exec -T backend alembic upgrade head; then
              exit 0
            fi
            echo "alembic: попытка $attempt не удалась, жду базу..."
            sleep 3
          done
          echo "::error::миграции не применились за 90 секунд"
          exit 1

      # Тот же набор проверок, что и в globalSetup, но с внятной ошибкой в CI.
      - name: Wait for backend and frontend
        run: |
          for url in "http://localhost:8000/files?limit=1" "http://localhost:3000/"; do
            for attempt in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "готов: $url"
                break
              fi
              if [ "$attempt" = "60" ]; then
                echo "::error::$url не ответил за 120 секунд"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Docker logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      # Трейсы, скриншоты и видео падений — лежат рядом с результатами тестов.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

      - name: Stop stack
        if: always()
        run: $COMPOSE down -v
