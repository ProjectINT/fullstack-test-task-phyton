services:
  backend:
    build: ./backend
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    volumes:
      - ./backend:/backend
    env_file: ".env.dev"
    ports:
      - "8000:8000"
    depends_on:
      - backend-db

  backend-worker:
    build: ./backend
    command: [ 'celery', '-A', 'src.worker.celery_app.celery_app', 'worker', '-l', 'info' ]
    container_name: backend-worker
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
    depends_on:
      - backend-db

  backend-db:
    image: postgres:latest
    container_name: backend-db
    ports:
      - "5433:5433"
    env_file: ".env.dev"
    volumes:
      - backend-db-volume:/var/lib/postgresql

  backend-redis:
    image: redis:latest
    container_name: backend-redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL, по которому браузер пользователя ходит в API (не внутрисетевой хост)
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: frontend
    environment:
      # URL для запросов с сервера Next (серверные компоненты):
      # внутри docker-сети бэкенд доступен по имени сервиса, а не по localhost
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-db-volume:
